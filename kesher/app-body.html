<style>
/* Layout: one phone-width column; each profile is a vertical stack of photos and prompts, with a fixed tab bar at the bottom. */
:root {
  --bg: #EEF1F0;
  --surface: #FFFFFF;
  --ink: #16201F;
  --muted: #5C6B69;
  --line: #D5DDDB;
  --accent: #0E5E58;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EAE7;
  --rose: #B23A55;
  --rose-soft: #F6DDE3;
  --shadow: 0 1px 2px rgb(22 32 31 / .06), 0 6px 20px rgb(22 32 31 / .07);
  --f-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --f-body: "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #18201F; --ink: #E8EEED; --muted: #98A8A5; --line: #2B3634;
    --accent: #4FB3A9; --accent-ink: #062320; --accent-soft: #1E3533;
    --rose: #E57C93; --rose-soft: #3A2128;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #18201F; --ink: #E8EEED; --muted: #98A8A5; --line: #2B3634;
  --accent: #4FB3A9; --accent-ink: #062320; --accent-soft: #1E3533;
  --rose: #E57C93; --rose-soft: #3A2128;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-size: 28px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
.brand span { color: var(--accent); }
.rose-count { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }

.search { display: flex; gap: 8px; align-items: center; }
.search-field { position: relative; flex: 1; min-width: 0; }
.search-field svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search-field input {
  width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); padding-inline: 38px 36px;
}
.search-field .clear { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 18px; }
.filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.filter-select { width: 100%; min-width: 0; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding-inline: 8px; font-size: 15px; }
.filter-select.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; white-space: nowrap; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-start: 4px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }

main {
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.result-line { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.result-line b { color: var(--ink); }

/* Profile */
.profile { display: flex; flex-direction: column; gap: 14px; }
.p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.p-name { font-family: var(--f-display); font-size: 32px; font-weight: 700; margin: 0; line-height: 1.1; text-wrap: balance; }
.p-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; color: var(--muted); background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.p-meta span { display: inline-flex; align-items: center; gap: 6px; }
.p-meta svg { width: 16px; height: 16px; }
.p-meta .city { color: var(--accent); font-weight: 700; }
.details { background: var(--surface); border-radius: 16px; padding: 4px 16px; box-shadow: var(--shadow); }
.details .vitals { display: flex; gap: 8px 18px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.details .vitals span { display: inline-flex; align-items: center; gap: 6px; }
.details .vitals svg { width: 18px; height: 18px; color: var(--muted); }
.details dl { margin: 0; }
.details .drow { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.details .drow:last-child { border-bottom: 0; }
.details dt { color: var(--muted); font-size: 14px; }
.details dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.details .habits { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 14px; border-top: 1px solid var(--line); }
.details .habit { background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 14px; }
.details .habit b { color: var(--muted); font-weight: 600; }
.form h2 { font-family: var(--f-display); font-size: 20px; margin: 10px 0 0; }

.photo {
  position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 16px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.avatar svg { width: 100%; height: 100%; display: block; }
.photo .cap { position: absolute; inset-inline-start: 14px; top: 14px; color: #fff; font-size: 14px; font-weight: 600; background: rgb(0 0 0 / .32); padding: 4px 10px; border-radius: 999px; max-width: calc(100% - 28px); }
.prompt { position: relative; background: var(--surface); border-radius: 16px; padding: 22px 18px 26px; box-shadow: var(--shadow); }
.prompt .q { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
.prompt .a { font-family: var(--f-display); font-size: 26px; font-weight: 500; line-height: 1.3; margin: 0; padding-inline-end: 44px; text-wrap: pretty; }
.heart {
  position: absolute; inset-inline-end: 12px; bottom: 12px; width: 52px; height: 52px; border-radius: 50%;
  border: 0; background: var(--surface); color: var(--accent); box-shadow: var(--shadow);
  display: grid; place-items: center; transition: transform .15s;
}
.heart:hover { transform: scale(1.06); }
.heart svg { width: 24px; height: 24px; }
.prompt .heart { bottom: 12px; }

.skip-wrap { position: sticky; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: flex-start; pointer-events: none; margin-top: -8px; }
.skip { pointer-events: auto; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; }
.skip svg { width: 26px; height: 26px; }

.empty { text-align: center; padding: 48px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h2 { font-family: var(--f-display); color: var(--ink); font-size: 24px; margin: 0; text-wrap: balance; }
.empty p { margin: 0; max-width: 32ch; }

.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.rose { background: var(--rose); color: #fff; }

/* Lists */
.section-title { font-family: var(--f-display); font-size: 26px; margin: 0 0 4px; }
.section-sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px 12px; border: 0; text-align: start; width: 100%; }
.avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 22px; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.row .txt { flex: 1; min-width: 0; }
.row .t1 { font-weight: 700; }
.row .t2 { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .actions { display: flex; gap: 6px; }
.tag-rose { color: var(--rose); font-weight: 700; font-size: 13px; }

.like-card { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.like-card .photo { border-radius: 0; aspect-ratio: 16 / 10; }
.like-card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.like-card .note { background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; font-size: 15px; }
.like-card .note.rose { background: var(--rose-soft); }
.like-card .btns { display: flex; gap: 8px; }
.like-card .btns .btn { flex: 1; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 8px; min-height: 50vh; }
.chat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.chat-head .back { border: 0; background: none; font-size: 24px; width: 40px; height: 40px; border-radius: 10px; }
.bubble { max-width: 78%; padding: 8px 14px; border-radius: 18px; font-size: 16px; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-end-start-radius: 4px; }
.bubble.them { align-self: flex-end; background: var(--surface); border-end-end-radius: 4px; }
.bubble.ctx { align-self: center; background: transparent; color: var(--muted); font-size: 13px; text-align: center; max-width: 90%; }
.composer { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding-block: 10px; background: var(--bg); }
.composer input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding-inline: 16px; }

/* Profile edit */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.field textarea { min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.upload { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.upload label { aspect-ratio: 4 / 5; max-width: 100%; border: 1.5px dashed var(--line); border-radius: 12px; display: grid; place-items: center; color: var(--muted); font-size: 13px; cursor: pointer; overflow: hidden; background: var(--surface); text-align: center; }
.upload img { width: 100%; height: 100%; object-fit: cover; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* Tab bar */
nav.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: none; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); position: relative; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; }
nav.tabs .badge { position: absolute; top: 8px; inset-inline-start: calc(50% + 6px); background: var(--rose); color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding-inline: 4px; font-variant-numeric: tabular-nums; }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-height: 90%; overflow-y: auto; }
.sheet .preview { background: var(--surface); border-radius: 14px; padding: 14px; }
.sheet .preview .q { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
.sheet .preview .a { font-family: var(--f-display); font-size: 20px; margin: 0; }
.sheet .preview .photo { aspect-ratio: 16 / 9; }
.sheet textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; min-height: 64px; resize: none; }
.sheet .btns { display: flex; gap: 8px; }
.sheet .btns .btn { flex: 1; }

.match-pop { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-block: 12px; }
.match-pop h2 { font-family: var(--f-display); font-size: 34px; margin: 0; color: var(--accent); }
.match-pop .pair { display: flex; gap: 0; }
.match-pop .pair .avatar { width: 84px; height: 84px; font-size: 34px; border: 3px solid var(--bg); }
.match-pop .pair .avatar + .avatar { margin-inline-start: -16px; }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; max-width: calc(100% - 32px); text-align: center; }

.demo-note { font-size: 13px; color: var(--muted); text-align: center; margin: 18px 0 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  // Bust in local coordinates: origin at bottom centre, head centre at (0,-165)
  function person(p) {
    const L = look(p), h = L.hair;
    const back = L.style === 'long' ? `<path d="M-74 -150C-84 -246 84 -246 74 -150L84 -62C40 -48-40 -48-84 -62Z" fill="${h}"/>`
      : L.style === 'curly' ? [[-60,-120],[60,-120],[-66,-160],[66,-160]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="24" fill="${h}"/>`).join('') : '';
    const top = {
      long: `<path d="M-63 -160C-72 -248 72 -248 63 -160C46 -200-6 -214-63 -160Z" fill="${h}"/>`,
      bun: `<circle cx="0" cy="-240" r="26" fill="${h}"/><path d="M-60 -172C-64 -240 64 -240 60 -172C40 -206-40 -206-60 -172Z" fill="${h}"/>`,
      curly: [[-46,-206],[-18,-224],[14,-226],[44,-208],[-58,-180],[58,-180]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="24" fill="${h}"/>`).join(''),
      short: `<path d="M-61 -178C-64 -242 64 -242 61 -178C48 -204-24 -214-61 -178Z" fill="${h}"/>`,
      buzz: `<path d="M-59 -184C-60 -236 60 -236 59 -184C40 -206-40 -206-59 -184Z" fill="${h}" opacity=".85"/>`
    }[L.style];
    return `${back}
      <path d="M-132 0C-132 -72-92 -98-42 -102H42C92 -98 132 -72 132 0Z" fill="${L.shirt}"/>
      <path d="M-132 0C-132 -40-120 -60-104 -74L-90 0Z" fill="${L.shirt2}" opacity=".35"/>
      <rect x="-22" y="-128" width="44" height="40" rx="10" fill="${L.skin}"/>
      <path d="M-24 -102L0 -74L24 -102Z" fill="${L.skin}"/>
      <circle cx="-58" cy="-160" r="12" fill="${L.skin}"/><circle cx="58" cy="-160" r="12" fill="${L.skin}"/>
      <ellipse cx="0" cy="-165" rx="58" ry="66" fill="${L.skin}"/>
      ${L.beard ? `<path d="M-56 -168C-56 -104-26 -98 0 -98S56 -104 56 -168C46 -134 24 -128 0 -130S-46 -134-56 -168Z" fill="${h}" opacity=".55"/>` : ''}
      ${top}
      <path d="M-32 -184h18M14 -184h18" stroke="${h}" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-22" cy="-164" r="5.5" fill="#2A2320"/><circle cx="22" cy="-164" r="5.5" fill="#2A2320"/>
      ${L.glasses ? `<g fill="none" stroke="#2A2320" stroke-width="3.5"><circle cx="-22" cy="-164" r="15"/><circle cx="22" cy="-164" r="15"/><path d="M-7 -165h14"/></g>` : ''}
      <ellipse cx="-36" cy="-143" rx="9" ry="6" fill="#E46A6A" opacity=".28"/><ellipse cx="36" cy="-143" rx="9" ry="6" fill="#E46A6A" opacity=".28"/>
      <path d="M-17 -136Q0 -121 17 -136" fill="none" stroke="#7A3B2E" stroke-width="4" stroke-linecap="round"/>`;
  }
  function pet(kind, x) {
    if (kind === 'dog') return `<g transform="translate(${x} 500)">
      <ellipse cx="0" cy="-40" rx="52" ry="36" fill="#C58B4E"/><circle cx="0" cy="-92" r="34" fill="#C58B4E"/>
      <ellipse cx="-30" cy="-92" rx="11" ry="24" fill="#8A5A2B"/><ellipse cx="30" cy="-92" rx="11" ry="24" fill="#8A5A2B"/>
      <circle cx="-11" cy="-96" r="4" fill="#2A2320"/><circle cx="11" cy="-96" r="4" fill="#2A2320"/><ellipse cx="0" cy="-82" rx="7" ry="5" fill="#2A2320"/></g>`;
    return `<g transform="translate(${x} 500)">
      <ellipse cx="0" cy="-36" rx="44" ry="32" fill="#7D7F86"/><circle cx="0" cy="-84" r="30" fill="#7D7F86"/>
      <path d="M-26 -100L-22 -132L-4 -110ZM26 -100L22 -132L4 -110Z" fill="#7D7F86"/>
      <circle cx="-10" cy="-88" r="4" fill="#E8D36A"/><circle cx="10" cy="-88" r="4" fill="#E8D36A"/><path d="M-4 -77h8l-4 4z" fill="#E59AA0"/></g>`;
  }
  const SCENES = [
    [/מדבר|מכתש|נגב|רמון|עבדת|סיני|אדום|הרי אילת/, 'desert'],
    [/חוף|ים|גלישה|סאפ|צלילה|שונית|סירה|מרינה|צוק|טיילת/, 'beach'],
    [/בר |בבר|הופעה|פסטיבל|ברלין|פריז|ברצלונה|נאפולי|כיכר|רחוב|פלורנטין|העתיקה|שוק|פורטוגל|איסלנד|הודו|חתונה|משחק|רוטשילד/, 'city'],
    [/מטבח|קפה|ספרייה|מוזיאון|גלריה|תערוכה|סדנת|מעבדה|כנס|בבית|שולחן|חדר|מערכת|חלות|מנה|האקתון|טכניון|קרמיקה|בן גוריון|דגם|גיטרה|יוגה|עמידת/, 'indoor'],
    [/טיול|הר|כרמל|גליל|נחל|פארק|אלפים|גן|ריצה|אופניים|ענבה|יקב|ספארי|גג|זריחה|תצפית|שקיעה/, 'nature']
  ];
  function scene(kind, k) {
    switch (kind) {
      case 'beach': return `<rect width="400" height="500" fill="#F7D9C4"/><rect width="400" height="200" fill="#A9D4E6"/>
        <circle cx="${90 + k * 40}" cy="150" r="46" fill="#FFE29A"/><rect y="270" width="400" height="90" fill="#3E8FB0"/>
        <path d="M0 300C60 290 120 310 200 298S340 290 400 300V360H0Z" fill="#2F7896"/><rect y="350" width="400" height="150" fill="#EBCB98"/>`;
      case 'desert': return `<rect width="400" height="500" fill="#F4B886"/><circle cx="300" cy="130" r="50" fill="#FFE8B0"/>
        <path d="M0 300C90 240 170 250 250 300S360 280 400 260V500H0Z" fill="#D9874E"/><path d="M0 360C80 330 200 350 400 320V500H0Z" fill="#C06A38"/>`;
      case 'city': return `<rect width="400" height="500" fill="#3D3A6B"/><circle cx="320" cy="90" r="30" fill="#F3E3B3"/>
        ${[[0,180,70],[70,240,60],[130,160,80],[210,210,60],[270,140,70],[340,230,60]].map(([x,y,w]) => `<rect x="${x}" y="${y}" width="${w}" height="${500-y}" fill="#2A2850"/>` +
          [0,1,2,3,4].map(r => `<rect x="${x+12}" y="${y+20+r*44}" width="12" height="16" fill="#F3C969" opacity="${(r+x)%3?'.85':'.25'}"/><rect x="${x+w-26}" y="${y+20+r*44}" width="12" height="16" fill="#F3C969" opacity="${(r+y)%3?'.25':'.85'}"/>`).join('')).join('')}`;
      case 'indoor': return `<rect width="400" height="500" fill="#E9E2D6"/><rect y="390" width="400" height="110" fill="#C9B79C"/>
        <rect x="${k%2?40:250}" y="70" width="110" height="140" rx="6" fill="#BFE0EA" stroke="#FFFFFF" stroke-width="8"/><path d="M${k%2?95:305} 70V210" stroke="#FFFFFF" stroke-width="6"/>
        <rect x="${k%2?300:50}" y="300" width="44" height="60" rx="6" fill="#B0603E"/><ellipse cx="${k%2?322:72}" cy="290" rx="38" ry="44" fill="#4E8A5C"/>`;
      case 'nature': return `<rect width="400" height="500" fill="#CFE7F1"/><circle cx="${80 + k * 50}" cy="110" r="36" fill="#FFF1C1"/>
        <path d="M0 290C90 200 170 220 260 270S370 230 400 220V500H0Z" fill="#8DBF8A"/><path d="M0 360C100 320 260 350 400 310V500H0Z" fill="#5E9C61"/>
        ${[[60,300],[330,270],[370,320]].map(([x,y]) => `<rect x="${x-5}" y="${y}" width="10" height="34" fill="#6B4A2E"/><circle cx="${x}" cy="${y-6}" r="26" fill="#3F7D48"/>`).join('')}`;
      default: return `<rect width="400" height="500" fill="#D7EAE7"/><circle cx="320" cy="120" r="90" fill="#BFDCD7"/><circle cx="70" cy="380" r="120" fill="#C7E2DE"/>`;
    }
  }
  const POSE = [[200, 1.15], [150, .85], [245, .95], [200, .72], [140, 1], [260, .8]];
  function illus(p, i) {
    const cap = p.photos[i] || '';
    const kind = (SCENES.find(([re]) => re.test(cap)) || [0, 'plain'])[1];
    const [cx, s] = POSE[i % POSE.length];
    const petKind = /כלב/.test(cap) ? 'dog' : /חתול/.test(cap) ? 'cat' : '';
    return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      ${scene(kind, i)}<g transform="translate(${cx} 500) scale(${s})">${person(p)}</g>${petKind ? pet(petKind, cx < 200 ? 320 : 80) : ''}</svg>`;
  }
  const faceSVG = p => `<svg viewBox="-100 -262 200 200" aria-hidden="true"><rect x="-100" y="-262" width="200" height="200" fill="${G[p.g][1]}"/>${person(p)}</svg>`;

  // City matching: free text, matched against the start or any part of the city name
  const cityMatches = (city, q) => !q || norm(city).includes(norm(q));

  // Kids filter: values map to the profile's "kids" / "wantKids" fields
  const KIDS_FILTERS = [
    ['', 'ילדים: הכל'], ['none', 'בלי ילדים'], ['has', 'עם ילדים'], ['wants', 'רוצה ילדים']
  ];
  const kidsMatch = (p, f) => !f
    || (f === 'none' && p.kids === 'אין לי ילדים')
    || (f === 'has' && p.kids === 'יש לי ילדים')
    || (f === 'wants' && ['רוצה', 'פתוח/ה לזה'].includes(p.wantKids));
  const RELIG_OPTS = FIELDS.find(f => f.k === 'relig').opts;
  const available = p => !S.skipped.includes(p.id) && !S.liked[p.id] && !S.matches[p.id];
  const passesFilters = p => p.age <= S.ageMax && (!S.relig || p.relig === S.relig) && kidsMatch(p, S.kidsF);
  const anyFilter = () => S.relig || S.kidsF || S.ageMax < 40;

  function deck() {
    return PROFILES.filter(p => available(p) && passesFilters(p) && cityMatches(p.city, S.city));
  }
  const incomingLikes = () => PROFILES.filter(p => p.likesMe && !S.liked[p.id] && !S.matches[p.id] && !S.skipped.includes(p.id) && !S.removedLikes.includes(p.id));

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
  }

  // ---------- Header (search by city) ----------
  function renderHeader() {
    const top = $('#top');
    if (S.tab !== 'discover') {
      top.innerHTML = `<div class="brand-row"><div class="brand">קֶ<span>שֶׁ</span>ר</div><span class="rose-count">חינם לגמרי</span></div>`;
      return;
    }
    const counts = {};
    PROFILES.forEach(p => { if (available(p) && passesFilters(p)) counts[p.city] = (counts[p.city] || 0) + 1; });
    const cityList = [...new Set(PROFILES.map(p => p.city))];
    top.innerHTML = `
      <div class="brand-row"><div class="brand">קֶ<span>שֶׁ</span>ר</div><span class="rose-count">חינם לגמרי</span></div>
      <div class="search">
        <div class="search-field">
          ${I.search}
          <input id="city-q" type="search" list="city-list" placeholder="חיפוש לפי עיר, למשל חיפה" value="${esc(S.city)}" aria-label="חיפוש לפי עיר" autocomplete="off">
          <button class="clear" id="city-clear" aria-label="ניקוי החיפוש" ${S.city ? '' : 'hidden'}>×</button>
          <datalist id="city-list">${CITIES.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
        </div>
      </div>
      <div class="filters">
        <select class="filter-select ${S.ageMax < 40 ? 'on' : ''}" id="age-max" aria-label="גיל מקסימלי">
          ${[[40, 'גיל: הכל'], [30, 'עד 30'], [35, 'עד 35']].map(([a, l]) => `<option value="${a}" ${S.ageMax == a ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <select class="filter-select ${S.relig ? 'on' : ''}" id="f-relig-filter" aria-label="סינון לפי דת">
          <option value="">דת: הכל</option>${RELIG_OPTS.map(o => `<option ${S.relig === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select>
        <select class="filter-select ${S.kidsF ? 'on' : ''}" id="f-kids-filter" aria-label="סינון לפי ילדים">
          ${KIDS_FILTERS.map(([v, l]) => `<option value="${v}" ${S.kidsF === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="chips" role="group" aria-label="ערים">
        <button class="chip" data-city="" aria-pressed="${!S.city}">כל הערים</button>
        ${cityList.map(c => `<button class="chip" data-city="${esc(c)}" aria-pressed="${S.city === c}">${esc(c)}<span class="n">${counts[c] || 0}</span></button>`).join('')}
      </div>`;
    const q = $('#city-q');
    q.addEventListener('input', () => { S.city = q.value.trim(); save(); $('#city-clear').hidden = !S.city; syncChips(); renderView(); });
    $('#city-clear').onclick = () => { S.city = ''; save(); renderHeader(); renderView(); };
    $('#age-max').onchange = e => { S.ageMax = +e.target.value; save(); renderHeader(); renderView(); };
    $('#f-relig-filter').onchange = e => { S.relig = e.target.value; save(); renderHeader(); renderView(); };
    $('#f-kids-filter').onchange = e => { S.kidsF = e.target.value; save(); renderHeader(); renderView(); };
    top.querySelectorAll('.chip').forEach(b => b.onclick = () => { S.city = b.dataset.city; save(); renderHeader(); renderView(); });
  }
  function syncChips() { document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.city === S.city || (!b.dataset.city && !S.city)))); }

  // ---------- Views ----------
  function photoHTML(p, i, withHeart) {
    return `<div class="photo" style="background:${grad((p.g + i) % G.length)}">
      ${illus(p, i)}
      <span class="cap">${esc(p.photos[i])}</span>
      ${withHeart ? `<button class="heart" data-kind="photo" data-i="${i}" aria-label="לייק לתמונה: ${esc(p.photos[i])}">${I.heart}</button>` : ''}
    </div>`;
  }
  function promptHTML(p, i) {
    const pr = p.prompts[i];
    return `<div class="prompt"><p class="q">${esc(pr.q)}</p><p class="a">${esc(pr.a)}</p>
      <button class="heart" data-kind="prompt" data-i="${i}" aria-label="לייק לתשובה: ${esc(pr.q)}">${I.heart}</button></div>`;
  }

  function detailsHTML(p) {
    const rows = FIELDS.filter(f => !f.habit && !f.vital && p[f.k]);
    const habits = FIELDS.filter(f => f.habit && p[f.k]);
    return `<section class="details" aria-label="פרטים">
      <div class="vitals">
        <span>${I.cake}${p.age}</span><span>${I.ruler}${p.height ? p.height + ' ס״מ' : ''}</span>
        <span style="color:var(--accent)">${I.pin}${esc(p.city)}</span>${p.zodiac ? `<span>${I.star}${esc(p.zodiac)}</span>` : ''}
      </div>
      <dl>
        ${p.job ? `<div class="drow"><dt>עיסוק</dt><dd>${esc(p.job)}</dd></div>` : ''}
        ${rows.map(f => `<div class="drow"><dt>${f.label}</dt><dd>${esc(p[f.k])}</dd></div>`).join('')}
      </dl>
      ${habits.length ? `<div class="habits">${habits.map(f => `<span class="habit"><b>${f.label}:</b> ${esc(p[f.k])}</span>`).join('')}</div>` : ''}
    </section>`;
  }

  function renderDiscover(v) {
    const d = deck();
    const where = S.city ? `ב<b>${esc(S.city)}</b>` : 'בכל הערים';
    const tags = [S.ageMax < 40 && 'עד גיל ' + S.ageMax, S.relig, S.kidsF && KIDS_FILTERS.find(k => k[0] === S.kidsF)[1]].filter(Boolean);
    if (!d.length) {
      v.innerHTML = `<div class="empty"><h2>אין כרגע עוד פרופילים ${S.city ? 'ב' + esc(S.city) : ''}</h2>
        <p>נסו עיר אחרת או נקו חלק מהסינונים (גיל, דת, ילדים). אפשר גם להחזיר את הפרופילים שדילגתם עליהם.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          ${S.city ? '<button class="btn" id="all-cities">חיפוש בכל הערים</button>' : ''}
          ${anyFilter() ? '<button class="btn" id="clear-filters">ניקוי סינונים</button>' : ''}
          <button class="btn ghost" id="reset-skips">הצגת פרופילים שדילגתי</button>
        </div></div>`;
      const a = $('#all-cities'); if (a) a.onclick = () => { S.city = ''; save(); renderHeader(); renderView(); };
      const cf = $('#clear-filters'); if (cf) cf.onclick = () => { S.relig = ''; S.kidsF = ''; S.ageMax = 40; save(); renderHeader(); renderView(); };
      $('#reset-skips').onclick = () => { S.skipped = []; save(); renderHeader(); renderView(); };
      return;
    }
    const p = d[0];
    v.innerHTML = `
      <p class="result-line">${d.length === 1 ? "פרופיל אחד" : d.length + " פרופילים"} ${where}${tags.length ? ' · ' + esc(tags.join(', ')) : ''}</p>
      <article class="profile" aria-label="פרופיל של ${esc(p.name)}">

          <button class="btn rose" id="send-rose">${I.rose.replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} שליחת ורד</button></div>
        ${photoHTML(p, 0, true)}
        ${detailsHTML(p)}
        ${promptHTML(p, 0)}
        ${photoHTML(p, 1, true)}
        ${photoHTML(p, 2, true)}
        ${promptHTML(p, 1)}
        ${photoHTML(p, 3, true)}
        ${photoHTML(p, 4, true)}
        ${promptHTML(p, 2)}
        ${photoHTML(p, 5, true)}
        <div class="skip-wrap"><button class="skip" id="skip" aria-label="דילוג על ${esc(p.name)}">${I.x}</button></div>
      </article>
      <p class="demo-note">קשר חינמית לגמרי: לייקים, ורדים, סינון לפי עיר וגיל, ורשימת מי שאהבו אותך פתוחים לכולם בלי הגבלה ובלי תשלום. הפרופילים לדוגמה בלבד, והנתונים נשמרים בדפדפן שלכם.</p>`;
    v.querySelectorAll('.heart').forEach(b => b.onclick = () => openLike(p, b.dataset.kind, +b.dataset.i, false));
    $('#send-rose').onclick = () => openLike(p, 'prompt', 0, true);
    $('#skip').onclick = () => { S.skipped.push(p.id); save(); renderHeader(); renderView(); window.scrollTo({ top: 0 }); };
  }

  function openLike(p, kind, i, rose) {
    const preview = kind === 'photo' ? photoHTML(p, i, false)
      : `<p class="q">${esc(p.prompts[i].q)}</p><p class="a">${esc(p.prompts[i].a)}</p>`;
    const L = $('#layer');
    L.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" dir="rtl" role="dialog" aria-modal="true" aria-label="שליחת לייק ל${esc(p.name)}">
      <strong style="font-size:18px">${rose ? 'שליחת ורד ל' : 'לייק ל'}${esc(p.name)}</strong>
      <div class="preview">${preview}</div>
      <textarea id="like-note" maxlength="140" placeholder="הוסיפו תגובה כדי לבלוט (לא חובה)"></textarea>
      <div class="btns"><button class="btn ghost" id="like-cancel">ביטול</button>
      <button class="btn ${rose ? 'rose' : ''}" id="like-send">${rose ? 'שליחת ורד' : 'שליחת לייק'}</button></div>
    </div></div>`;
    const close = () => { L.innerHTML = ''; };
    $('#sheet-bg').onclick = e => { if (e.target.id === 'sheet-bg') close(); };
    $('#like-cancel').onclick = close;
    $('#like-note').focus();
    $('#like-send').onclick = () => {
      const note = $('#like-note').value.trim();
      const about = kind === 'photo' ? `תמונה "${p.photos[i]}"` : `"${p.prompts[i].q}"`;
      if (p.likesMe) {
        S.matches[p.id] = { msgs: [{ who: 'ctx', t: `עשיתם לייק ל${about}` }].concat(note ? [{ who: 'me', t: note }] : []), rose };
        save(); close(); renderHeader(); renderTabs(); renderView(); showMatch(p);
      } else {
        S.liked[p.id] = { about, note, rose }; save(); close();
        toast(rose ? `שלחתם ורד ל${p.name}` : `הלייק נשלח ל${p.name}`);
        renderHeader(); renderView(); window.scrollTo({ top: 0 });
      }
    };
  }

  function avatarHTML(p) { return `<span class="avatar" style="background:${grad(p.g)}" aria-hidden="true">${faceSVG(p)}</span>`; }
  function meAvatar() {
    const ph = S.me.photos[0];
    return `<span class="avatar" style="background:${grad(0)}" aria-hidden="true">${ph ? `<img src="${ph}" alt="">` : esc((S.me.name || 'א')[0])}</span>`;
  }

  function showMatch(p) {
    const L = $('#layer');
    L.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" dir="rtl" role="dialog" aria-modal="true" aria-label="התאמה חדשה">
      <div class="match-pop"><div class="pair">${meAvatar()}${avatarHTML(p)}</div>
      <h2>יש קשר!</h2><p style="margin:0">גם ${esc(p.name)} עשה/תה לך לייק. זה הזמן לכתוב משהו.</p></div>
      <div class="btns"><button class="btn ghost" id="m-later">אחר כך</button><button class="btn" id="m-chat">שליחת הודעה</button></div>
    </div></div>`;
    $('#m-later').onclick = () => { L.innerHTML = ''; };
    $('#m-chat').onclick = () => { L.innerHTML = ''; chatWith = p.id; setTab('matches'); };
  }

  function renderLikes(v) {
    const inc = incomingLikes();
    const sent = Object.keys(S.liked).map(Number).map(byId).filter(Boolean);
    v.innerHTML = `<h1 class="section-title">אהבו אותך</h1>
      <p class="section-sub">${inc.length ? `${inc.length} אנשים עשו לך לייק. לייק בחזרה יוצר התאמה.` : 'כשמישהו יעשה לך לייק, הוא יופיע כאן.'}</p>
      <div class="list">${inc.map(p => `<div class="like-card">
        ${photoHTML(p, 0, false)}
        <div class="body"><div><strong style="font-size:18px">${esc(p.name)}, ${p.age}</strong> · <span style="color:var(--accent);font-weight:700">${esc(p.city)}</span></div>
          <div class="note">אהב/ה את התשובה שלך ל"${esc(S.me.prompts[0].q)}"</div>
          <div class="btns"><button class="btn ghost" data-remove="${p.id}">הסרה</button><button class="btn" data-back="${p.id}">לייק בחזרה</button></div>
        </div></div>`).join('')}</div>
      ${sent.length ? `<h2 class="section-title" style="font-size:20px;margin-top:24px">לייקים ששלחת</h2>
        <div class="list">${sent.map(p => `<div class="row">${avatarHTML(p)}<div class="txt"><div class="t1">${esc(p.name)} · ${esc(p.city)} ${S.liked[p.id].rose ? '<span class="tag-rose">ורד</span>' : ''}</div>
        <div class="t2">על ${esc(S.liked[p.id].about)}${S.liked[p.id].note ? ' · ' + esc(S.liked[p.id].note) : ''}</div></div></div>`).join('')}</div>` : ''}`;
    v.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
      const p = byId(+b.dataset.back);
      S.matches[p.id] = { msgs: [{ who: 'ctx', t: `${p.name} אהב/ה את הפרופיל שלך` }] }; save(); renderTabs(); renderView(); showMatch(p);
    });
    v.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { S.removedLikes.push(+b.dataset.remove); save(); renderTabs(); renderView(); });
  }

  function renderMatches(v) {
    if (chatWith && S.matches[chatWith]) return renderChat(v, byId(chatWith));
    const ids = Object.keys(S.matches).map(Number);
    if (!ids.length) {
      v.innerHTML = `<div class="empty"><h2>עוד אין התאמות</h2><p>עשו לייק לתמונה או לתשובה בפרופיל. כשהלייק הדדי, השיחה תיפתח כאן.</p><button class="btn" id="go-d">לגלות פרופילים</button></div>`;
      $('#go-d').onclick = () => setTab('discover'); return;
    }
    v.innerHTML = `<h1 class="section-title">התאמות</h1><p class="section-sub">${ids.length} שיחות פתוחות</p>
      <div class="list">${ids.map(id => { const p = byId(id), m = S.matches[id], last = m.msgs[m.msgs.length - 1];
        return `<button class="row" data-chat="${id}">${avatarHTML(p)}<div class="txt"><div class="t1">${esc(p.name)} · ${esc(p.city)}</div>
        <div class="t2">${last.who === 'me' ? 'את/ה: ' : ''}${esc(last.t)}</div></div></button>`; }).join('')}</div>`;
    v.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => { chatWith = +b.dataset.chat; renderView(); });
  }

  function renderChat(v, p) {
    const m = S.matches[p.id];
    v.innerHTML = `<div class="chat-head"><button class="back" id="back" aria-label="חזרה להתאמות">→</button>${avatarHTML(p)}
      <div><div style="font-weight:700">${esc(p.name)}, ${p.age}</div><div style="font-size:14px;color:var(--muted)">${esc(p.city)} · ${esc(p.job)}</div></div></div>
      <div class="chat" id="chat">${m.msgs.map(x => `<div class="bubble ${x.who}">${esc(x.t)}</div>`).join('')}</div>
      <form class="composer" id="composer"><input id="msg" placeholder="כתיבת הודעה" autocomplete="off" aria-label="הודעה"><button class="btn">שליחה</button></form>`;
    $('#back').onclick = () => { chatWith = null; renderView(); };
    $('#composer').onsubmit = e => {
      e.preventDefault(); const t = $('#msg').value.trim(); if (!t) return;
      m.msgs.push({ who: 'me', t }); save(); renderChat(v, p); $('#msg').focus();
      setTimeout(() => {
        m.msgs.push({ who: 'them', t: REPLIES[m.msgs.filter(x => x.who === 'them').length % REPLIES.length] }); save();
        if (S.tab === 'matches' && chatWith === p.id) { renderChat(v, p); $('#msg').focus(); }
      }, 1200);
    };
    window.scrollTo({ top: document.body.scrollHeight });
  }

  function renderMe(v) {
    const me = S.me;
    v.innerHTML = `<h1 class="section-title">הפרופיל שלי</h1><p class="section-sub">כך אחרים יראו אותך. העיר שלך קובעת את החיפוש ברירת המחדל.</p>
      <form class="form" id="me-form">
        <div class="upload">${[0,1,2,3,4,5].map(i => `<label for="ph${i}">${me.photos[i] ? `<img src="${me.photos[i]}" alt="תמונה ${i+1}">` : 'הוספת תמונה'}<input id="ph${i}" type="file" accept="image/*" data-i="${i}"></label>`).join('')}</div>
        <div class="two">
          <div class="field"><label for="me-name">שם</label><input id="me-name" value="${esc(me.name)}"></div>
          <div class="field"><label for="me-age">גיל</label><input id="me-age" type="number" min="18" max="99" value="${me.age}"></div>
        </div>
        <div class="two">
          <div class="field"><label for="me-city">עיר</label><input id="me-city" list="me-cities" value="${esc(me.city)}"><datalist id="me-cities">${CITIES.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
          <div class="field"><label for="me-job">עיסוק</label><input id="me-job" value="${esc(me.job)}" placeholder="למשל מורה"></div>
        </div>
        <div class="field"><label for="me-height">גובה (ס״מ)</label><input id="me-height" type="number" min="120" max="230" value="${me.height || ''}"></div>
        <h2>פרטים</h2>
        <div class="two">${FIELDS.map(f => `<div class="field"><label for="f-${f.k}">${f.label}</label>${f.opts
          ? `<select id="f-${f.k}"><option value="">לא צוין</option>${f.opts.map(o => `<option ${me[f.k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
          : `<input id="f-${f.k}" value="${esc(me[f.k] || '')}" placeholder="${esc(f.placeholder || '')}">`}</div>`).join('')}</div>
        <h2>שאלות</h2>
        ${me.prompts.map((pr, i) => `<div class="field"><label for="pa${i}">${esc(pr.q)}</label><textarea id="pa${i}" placeholder="התשובה שלך">${esc(pr.a)}</textarea></div>`).join('')}
        <button class="btn">שמירת הפרופיל</button>
        <button type="button" class="btn ghost" id="reset-all">איפוס כל הנתונים</button>
      </form>`;
    v.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { // downscale so it fits in browser storage
        const img = new Image(); img.onload = () => {
          const c = document.createElement('canvas'), k = Math.min(1, 480 / img.width);
          c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          me.photos[+inp.dataset.i] = c.toDataURL('image/jpeg', .8); save(); renderMe(v);
        }; img.src = r.result;
      }; r.readAsDataURL(f);
    });
    $('#me-form').onsubmit = e => {
      e.preventDefault();
      me.name = $('#me-name').value.trim() || 'אני'; me.age = +$('#me-age').value || me.age;
      me.city = $('#me-city').value.trim(); me.job = $('#me-job').value.trim();
      me.prompts.forEach((pr, i) => pr.a = $('#pa' + i).value.trim());
      me.height = +$('#me-height').value || 0;
      FIELDS.forEach(f => { me[f.k] = $('#f-' + f.k).value.trim(); });
      S.city = me.city; save(); toast('הפרופיל נשמר. החיפוש מוגדר לעיר שלך');
    };
    let armed = false;
    $('#reset-all').onclick = e => {
      if (!armed) { armed = true; e.target.textContent = 'לחיצה נוספת תמחק הכול'; e.target.style.color = 'var(--rose)'; return; }
      S = fresh(); S.tab = 'me'; save(); renderAll(); toast('כל הנתונים אופסו');
    };
  }

  // ---------- Tabs ----------
  const TABS = [['discover', 'גילוי', I.discover], ['likes', 'אהבו אותך', I.likes], ['matches', 'התאמות', I.chat], ['me', 'פרופיל', I.me]];
  function renderTabs() {
    const n = incomingLikes().length;
    $('#tabs').innerHTML = TABS.map(([id, label, ic]) => `<button data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>${ic}<span>${label}</span>
      ${id === 'likes' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  }
  function setTab(t) { if (t !== 'matches') chatWith = null; S.tab = t; save(); renderAll(); window.scrollTo({ top: 0 }); }
  function renderView() {
    const v = $('#view');
    ({ discover: renderDiscover, likes: renderLikes, matches: renderMatches, me: renderMe })[S.tab](v);
  }
  function renderAll() { renderHeader(); renderTabs(); renderView(); }
  renderAll();
})();
</script>
