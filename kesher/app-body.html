<title>Kesher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one calm phone-width column. Photos run edge to edge in rounded frames, prompts sit on white cards,
   floating round buttons for like and skip, icon tab bar at the bottom. */
:root {
  --bg: #F6F5F8;
  --surface: #FFFFFF;
  --ink: #17151C;
  --muted: #6F6A7A;
  --line: #E8E5EE;
  --accent: #6A3FD6;
  --accent-ink: #FFFFFF;
  --accent-soft: #EFE9FD;
  --rose: #D23C6E;
  --rose-soft: #FCE8EF;
  --mint: #2E9C7E;
  --shadow-sm: 0 1px 2px rgb(23 21 28 / .06);
  --shadow: 0 2px 6px rgb(23 21 28 / .06), 0 12px 32px rgb(23 21 28 / .08);
  --match-a: #6A3FD6;
  --match-b: #E0567F;
  --f-ui: "Rubik", "Assistant", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --f-serif: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0E13; --surface: #1A1820; --ink: #F3F1F7; --muted: #A49FB0; --line: #2D2A36;
    --accent: #A98CFF; --accent-ink: #160F2B; --accent-soft: #2A2342; --rose: #FF7BA3; --rose-soft: #3B1D29; --mint: #5FD0AE;
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .4); --shadow: 0 2px 6px rgb(0 0 0 / .35), 0 12px 32px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0E13; --surface: #1A1820; --ink: #F3F1F7; --muted: #A49FB0; --line: #2D2A36;
  --accent: #A98CFF; --accent-ink: #160F2B; --accent-soft: #2A2342; --rose: #FF7BA3; --rose-soft: #3B1D29; --mint: #5FD0AE;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .4); --shadow: 0 2px 6px rgb(0 0 0 / .35), 0 12px 32px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.small-text { font-size: 14px; margin: 0; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
header.top, main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { padding-block: 12px 4px; display: flex; flex-direction: column; gap: 12px; }
header.top:empty { display: none; }
main { padding-block: 8px 24px; }

/* Brand */
.brand { font-family: var(--f-serif); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -.01em; display: inline-flex; align-items: flex-end; gap: 3px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-bottom: 4px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }

/* Search and chips */
.search-field { position: relative; }
.search-field > svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search-field input {
  width: 100%; height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  padding-inline: 44px 44px; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s;
}
.search-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search-field .clear { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); border: 0; background: var(--bg); width: 34px; height: 34px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.search-field .clear svg { width: 16px; height: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 4px; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-inline-start: 6px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .65; }
.filter-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 15px; }
.filter-btn svg { width: 18px; height: 18px; }
.filter-btn b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 20px; height: 20px; font-size: 12px; display: grid; place-items: center; padding-inline: 5px; }
.filter-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.result-line { font-size: 14px; color: var(--muted); margin: 4px 0 14px; }
.result-line b { color: var(--ink); font-weight: 600; }

/* Profile */
.profile { display: flex; flex-direction: column; gap: 14px; }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 2px 4px; }
.p-name { font-size: 34px; font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
.icon-btn { border: 0; background: transparent; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 24px; height: 24px; }

.photo { position: relative; margin: 0; aspect-ratio: 4 / 5; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--line); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prompt { position: relative; background: var(--surface); border-radius: var(--r); padding: 26px 22px 30px; box-shadow: var(--shadow-sm); }
.prompt .q { font-size: 15px; font-weight: 500; margin: 0 0 10px; color: var(--ink); }
.prompt .a { font-family: var(--f-serif); font-size: 28px; font-weight: 500; line-height: 1.3; margin: 0; padding-inline-end: 52px; text-wrap: pretty; }
.like-btn {
  position: absolute; inset-inline-end: 14px; bottom: 14px; width: 54px; height: 54px; border-radius: 50%;
  border: 0; background: var(--surface); color: var(--accent); box-shadow: var(--shadow);
  display: grid; place-items: center; transition: transform .18s cubic-bezier(.3,1.6,.5,1), background .15s;
}
.like-btn:hover { transform: scale(1.08); }
.like-btn:active { transform: scale(.92); }
.like-btn svg { width: 26px; height: 26px; }

.vitals { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; }
.vitals .strip { display: flex; overflow-x: auto; scrollbar-width: none; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.vitals .strip::-webkit-scrollbar { display: none; }
.vitals .strip span { flex: none; display: inline-flex; align-items: center; gap: 7px; font-weight: 500; padding-inline: 14px; border-inline-start: 1px solid var(--line); white-space: nowrap; }
.vitals .strip span:first-child { padding-inline-start: 0; border-inline-start: 0; }
.vitals svg { width: 20px; height: 20px; color: var(--muted); }
.vline { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--line); font-weight: 500; }
.vline:last-child { border-bottom: 0; }
.vline span { min-width: 0; overflow-wrap: anywhere; }

.skip {
  position: fixed; z-index: 4; inset-inline-start: max(20px, calc(50% - 240px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center; transition: transform .18s cubic-bezier(.3,1.6,.5,1);
}
.skip:hover { transform: scale(1.06); }
.skip:active { transform: scale(.92); }
.skip svg { width: 26px; height: 26px; }

/* Card transitions */
.entering { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.leave-skip { animation: out-skip .26s ease-in both; }
.leave-like { animation: out-like .26s ease-in both; }
@keyframes out-skip { to { opacity: 0; transform: translateX(40%) rotate(3deg); } }
@keyframes out-like { to { opacity: 0; transform: translateX(-40%) rotate(-3deg); } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 16px; transition: transform .12s, background .15s, opacity .15s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--ink); color: var(--surface); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.text { background: none; color: var(--muted); padding-inline: 8px; }
.btn.rose { background: var(--rose-soft); color: var(--rose); }
.btn.danger { background: var(--rose); color: #fff; }
.btn.ghost.danger { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
.danger-text { color: var(--rose) !important; }
.btn.big { padding-block: 15px; font-size: 17px; width: 100%; }
.btn.small { padding: 7px 14px; font-size: 14px; }
.btn.light { background: #fff; color: #1B1430; }
.light-text { color: rgb(255 255 255 / .85) !important; }
.btn:disabled { opacity: .5; cursor: default; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row-btns .btn { flex: 1; min-width: 130px; }

/* Empty and loading states */
.empty { text-align: center; padding: 56px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty-art { width: 84px; height: 84px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 4px; }
.empty-art svg { width: 38px; height: 38px; }
.empty h2 { font-family: var(--f-serif); font-size: 26px; margin: 0; text-wrap: balance; }
.empty p { margin: 0; max-width: 32ch; color: var(--muted); }
.loading { height: 60vh; display: grid; place-items: center; }
.loading::after { content: ""; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Section titles */
.title { font-size: 30px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.h2 { font-size: 22px; font-weight: 700; margin: 0; }
.h3 { font-size: 18px; font-weight: 700; margin: 0; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 14px; }
.card.quiet { background: transparent; box-shadow: none; padding-inline: 0; }

/* Likes you grid */
.like-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.like-tile { border: 0; padding: 0; background: var(--surface); border-radius: var(--r); overflow: hidden; text-align: start; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); transition: transform .15s; }
.like-tile:hover { transform: translateY(-2px); }
.like-tile.has-rose { box-shadow: 0 0 0 2px var(--rose); }
.tile-photo { position: relative; aspect-ratio: 4 / 5; background: var(--line); display: block; }
.tile-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile-rose { position: absolute; top: 8px; inset-inline-end: 8px; width: 32px; height: 32px; border-radius: 50%; background: var(--rose); color: #fff; display: grid; place-items: center; }
.tile-rose svg { width: 18px; height: 18px; }
.tile-name { font-weight: 700; padding: 10px 12px 0; }
.tile-note { font-size: 13px; color: var(--muted); padding: 2px 12px 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.like-context { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; }
.like-context svg { width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }
.like-context.rose { background: var(--rose-soft); }
.like-context.rose svg { color: var(--rose); }
.like-context b { display: block; margin-top: 4px; }

/* Matches */
.new-matches { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
.nm { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; padding: 0; }
.list { display: flex; flex-direction: column; }
.row { display: flex; gap: 14px; align-items: center; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; text-align: start; width: 100%; }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t1 { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.row .t2 { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.your-turn { font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; }
.avatar { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 20px; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 60px; height: 60px; font-size: 24px; }
.avatar.xl { width: 96px; height: 96px; font-size: 38px; }
.avatar.ring { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }

/* Chat */
.chat-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; display: flex; align-items: center; gap: 6px; background: var(--bg); padding-block: 8px; margin-inline: -4px; }
.chat-who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: start; padding: 0; }
.chat-who b { display: block; font-size: 17px; }
.chat-who small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-who > span:last-child { min-width: 0; }
.chat { display: flex; flex-direction: column; gap: 6px; min-height: calc(100vh - 290px); min-height: calc(100dvh - 290px); padding-block: 8px; }
.bubble { max-width: 78%; padding: 10px 15px; border-radius: 22px; font-size: 16px; overflow-wrap: anywhere; animation: rise .2s ease-out both; }
.bubble.me { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-end-start-radius: 6px; }
.bubble.them { align-self: flex-end; background: var(--surface); box-shadow: var(--shadow-sm); border-end-end-radius: 6px; }
.bubble.ctx { align-self: center; background: transparent; color: var(--muted); font-size: 13px; text-align: center; max-width: 92%; display: flex; gap: 6px; align-items: center; animation: none; }
.bubble.ctx svg { width: 16px; height: 16px; }
.composer { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding-block: 10px; background: var(--bg); }
.composer input { flex: 1; min-width: 0; height: 50px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding-inline: 20px; }
.composer input:focus { outline: none; border-color: var(--accent); }
.send { width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.send svg { width: 22px; height: 22px; transform: scaleX(-1); }

/* Forms */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select, .prompt-edit select, .prompt-edit textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 13px; width: 100%; min-width: 0;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field textarea:focus, .field select:focus, .prompt-edit select:focus, .prompt-edit textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 360px) { .two { grid-template-columns: 1fr; } }
.prompt-edit { display: flex; flex-direction: column; gap: 6px; }
.prompt-edit select { font-weight: 600; }
.prompt-edit textarea { font-family: var(--f-serif); font-size: 19px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--accent); }
.form-error { margin: 0; color: var(--rose); font-weight: 600; }
.notice { background: var(--rose-soft); color: var(--ink); border-radius: 14px; padding: 12px 16px; margin: 0 0 14px; font-weight: 500; }
.sticky-save { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 2; box-shadow: var(--shadow); }

/* Auth */
.auth { max-width: 440px; margin: 0 auto; padding-block: 20px 32px; display: flex; flex-direction: column; gap: 22px; }
.auth-hero {
  border-radius: 28px; padding: 40px 24px 34px; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
  background: radial-gradient(120% 90% at 85% 0%, var(--match-b) 0%, transparent 60%), radial-gradient(120% 120% at 0% 100%, #3E2A8C 0%, transparent 60%), var(--match-a);
}
.auth-hero .brand { font-size: 52px; }
.auth-hero .brand-dot { background: #fff; width: 11px; height: 11px; margin-bottom: 8px; }
.auth-tag { margin: 0; font-size: 18px; line-height: 1.5; opacity: .95; }

/* My profile */
.me-card { display: flex; align-items: center; gap: 16px; margin: 6px 0 16px; }
.me-card > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meter { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--match-b)); border-radius: inherit; }
#view > .card, #view > .form > .card, #view > .notice { margin-bottom: 0; }
#view > section.card { margin-bottom: 14px; }
.upload { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slot { position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--bg); }
.slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.empty-slot { border: 2px dashed var(--line); display: grid; place-items: center; color: var(--accent); cursor: pointer; transition: border-color .15s, background .15s; }
.empty-slot:hover { border-color: var(--accent); background: var(--accent-soft); }
.empty-slot svg { width: 28px; height: 28px; }
.empty-slot.busy::after { content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.empty-slot.busy svg { display: none; }
.empty-slot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.slot-btn { position: absolute; top: 6px; border: 0; border-radius: 999px; background: rgb(0 0 0 / .55); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; backdrop-filter: blur(4px); }
.slot-btn.del { inset-inline-end: 6px; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; }
.slot-btn.del svg { width: 14px; height: 14px; }
.slot-btn.first { inset-inline-start: 6px; }
.slot-tag { position: absolute; inset-inline-start: 6px; top: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 3px 9px; }

/* Tab bar */
nav.tabs {
  position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: none; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); position: relative; font-size: 11px; font-weight: 500; }
nav.tabs button > svg { width: 26px; height: 26px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] > svg { stroke-width: 2.4; }
nav.tabs .tab-avatar { width: 28px; height: 28px; font-size: 13px; }
nav.tabs button[aria-current="page"] .tab-avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
nav.tabs .badge { position: absolute; top: 9px; inset-inline-start: calc(50% + 6px); background: var(--rose); color: #fff; font-size: 11px; font-weight: 700; min-width: 19px; height: 19px; border-radius: 10px; display: grid; place-items: center; padding-inline: 5px; font-variant-numeric: tabular-nums; }

/* Sheets */

    document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
  }
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const brand = `<div class="brand" aria-label="קשר">קֶשֶׁר<span class="brand-dot"></span></div>`;

  // ---------- State ----------
  let OPT = null, ME = null, tab = 'discover', chatWith = null, pollTimer = null, likesCount = 0;
  const DEFAULT_F = { city: '', ageMin: 18, ageMax: 80, relig: '', kids: '', status: '' };
  let F = { ...DEFAULT_F, ...load('kesher-filters-v2', {}) };
  let DISC = { profiles: [], total: 0, cityCounts: {} };
  const activeFilters = () => (F.ageMin > 18 || F.ageMax < 80 ? 1 : 0) + (F.relig ? 1 : 0) + (F.kids ? 1 : 0) + (F.status ? 1 : 0);

  // ---------- Auth ----------
  function showAuth(mode = 'register') {
    stopPoll(); closeSheet();
    $('#tabs-nav').hidden = true;
    $('#top').innerHTML = '';
    const v = $('#view');
    v.innerHTML = `<div class="auth">
      <div class="auth-hero">${brand}<p class="auth-tag">${mode === 'register' ? 'נבנה כדי שתמחקו אותו.<br>היכרויות אמיתיות, בחינם.' : 'טוב לראות אותך שוב.'}</p></div>
      <form class="card form" id="auth-form" novalidate>
        <h1 class="h2">${mode === 'register' ? 'יצירת חשבון' : 'התחברות'}</h1>
        ${mode === 'register' ? `<div class="field"><label for="r-name">שם פרטי</label><input id="r-name" autocomplete="given-name" required maxlength="40"></div>` : ''}
        <div class="field"><label for="r-email">אימייל</label><input id="r-email" type="email" autocomplete="email" required dir="ltr"></div>
        <div class="field"><label for="r-pass">סיסמה${mode === 'register' ? ' (לפחות 8 תווים)' : ''}</label><input id="r-pass" type="password" autocomplete="${mode === 'register' ? 'new-password' : 'current-password'}" required dir="ltr"></div>
        ${mode === 'register' ? `
        <div class="two">
          <div class="field"><label for="r-birth">תאריך לידה</label><input id="r-birth" type="date" required></div>
          <div class="field"><label for="r-gender">מגדר</label><select id="r-gender">${OPT.choices.gender.map(g => `<option>${esc(g)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label for="r-city">עיר</label><input id="r-city" list="r-cities" required maxlength="40"><datalist id="r-cities">${CITIES.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
        <label class="check"><input type="checkbox" id="r-adult"><span>אני בן/בת 18 ומעלה, אעלה רק תמונות שלי, ואני מסכים/ה ${DEMO ? 'לתנאי השימוש ולמדיניות הפרטיות' : 'ל<a href="terms.html" target="_blank">תנאי השימוש</a> ול<a href="privacy.html" target="_blank">מדיניות הפרטיות</a>'}</span></label>` : ''}
        <p class="form-error" id="auth-error" role="alert" hidden></p>
        <button class="btn primary big" id="auth-submit">${mode === 'register' ? 'בואו נתחיל' : 'התחברות'}</button>
        ${mode === 'login' ? '<button type="button" class="btn text" id="auth-forgot">שכחתי סיסמה</button>' : ''}
        <button type="button" class="btn text" id="auth-switch">${mode === 'register' ? 'כבר יש לי חשבון' : 'עוד אין לי חשבון? להרשמה'}</button>
      </form>${legalLinks()}</div>`;
    $('#auth-switch').onclick = () => showAuth(mode === 'register' ? 'login' : 'register');
    if (mode === 'login') $('#auth-forgot').onclick = showForgot;
    $('#auth-form').onsubmit = async e => {
      e.preventDefault();
      const err = $('#auth-error'); err.hidden = true;
      const btn = $('#auth-submit'); btn.disabled = true;
      try {
        if (mode === 'register') {
          if (!$('#r-adult').checked) throw new Error('צריך לאשר את הגיל, תנאי השימוש ומדיניות הפרטיות');
          await api('POST', '/api/register', {
            name: $('#r-name').value, email: $('#r-email').value, password: $('#r-pass').value,
            birthdate: $('#r-birth').value, gender: $('#r-gender').value, city: $('#r-city').value, acceptTerms: true
          });
        } else {
          await api('POST', '/api/login', { email: $('#r-email').value, password: $('#r-pass').value });
        }
        await startApp();
      } catch (ex) { err.textContent = ex.message; err.hidden = false; btn.disabled = false; }
    };
  }

  const DEMO = window.KESHER_DEMO === true; // the single-page demo has no separate legal pages
  const legalLinks = () => DEMO ? '' : `<p class="legal"><a href="terms.html" target="_blank">תנאי שימוש</a> · <a href="privacy.html" target="_blank">מדיניות פרטיות</a></p>`;

  // Small single-purpose screens shown before sign-in: forgot password, choose a new password
  function authCard(inner) {
    stopPoll(); closeSheet();
    $('#tabs-nav').hidden = true; $('#top').innerHTML = '';
    $('#view').innerHTML = `<div class="auth"><div class="auth-hero small">${brand}</div>${inner}${legalLinks()}</div>`;
  }
  function showForgot() {
    authCard(`<form class="card form" id="forgot-form" novalidate><h1 class="h2">איפוס סיסמה</h1>
      <p class="muted" style="margin:0">נשלח לך קישור לבחירת סיסמה חדשה.</p>
      <div class="field"><label for="fg-email">אימייל</label><input id="fg-email" type="email" autocomplete="email" dir="ltr" required></div>
      <p class="form-error" id="fg-error" role="alert" hidden></p>
      <button class="btn primary big" id="fg-send">שליחת קישור</button>
      <button type="button" class="btn text" id="fg-back">חזרה להתחברות</button></form>`);
    $('#fg-back').onclick = () => showAuth('login');
    $('#forgot-form').onsubmit = async e => {
      e.preventDefault();
      const err = $('#fg-error'); err.hidden = true;
      try {
        await api('POST', '/api/password/forgot', { email: $('#fg-email').value });
        authCard(`<div class="card form"><h1 class="h2">בדקו את תיבת המייל</h1><p style="margin:0">אם יש חשבון עם הכתובת הזאת, שלחנו אליה קישור לאיפוס הסיסמה. הקישור בתוקף לשעה.</p>
          <button class="btn ghost" id="fg-done">חזרה להתחברות</button></div>`);
        $('#fg-done').onclick = () => showAuth('login');
      } catch (x) { err.textContent = x.message; err.hidden = false; }
    };
  }
  function showReset(token) {
    authCard(`<form class="card form" id="reset-form" novalidate><h1 class="h2">בחירת סיסמה חדשה</h1>
      <div class="field"><label for="rs-pass">סיסמה חדשה (לפחות 8 תווים)</label><input id="rs-pass" type="password" autocomplete="new-password" dir="ltr" required></div>
      <p class="form-error" id="rs-error" role="alert" hidden></p>
      <button class="btn primary big">שמירה והתחברות</button></form>`);
    $('#reset-form').onsubmit = async e => {
      e.preventDefault();
      const err = $('#rs-error'); err.hidden = true;
      try { await api('POST', '/api/password/reset', { token, password: $('#rs-pass').value }); await startApp(); toast('הסיסמה עודכנה'); }
      catch (x) { err.textContent = x.message; err.hidden = false; }
    };
  }
  const needsVerify = () => ME && ME.verifyRequired && !ME.emailVerified;

  async function startApp() {
    ME = await api('GET', '/api/me');
    $('#tabs-nav').hidden = false;
    setTab(ME.photos.length ? 'discover' : 'me');
    refreshLikesCount();
  }
  const refreshLikesCount = () => api('GET', '/api/likes').then(l => { likesCount = l.length; renderTabs(); }).catch(() => {});

  // ---------- Profile rendering ----------
  function avatarHTML(p, cls = '') {
    return `<span class="avatar ${cls}" aria-hidden="true">${p.photos[0] ? `<img src="${esc(p.photos[0].url)}" alt="">` : esc((p.name || '?')[0])}</span>`;
  }
  function photoHTML(p, i, hearts) {
    const ph = p.photos[i];
    if (!ph) return '';
    return `<figure class="photo"><img src="${esc(ph.url)}" alt="תמונה ${i + 1} של ${esc(p.name)}" ${i ? 'loading="lazy"' : ''}>
      ${hearts ? `<button class="like-btn" data-kind="photo" data-i="${i}" aria-label="לייק לתמונה ${i + 1}">${I.heart}</button>` : ''}</figure>`;
  }
  function promptHTML(p, i, hearts) {
    const pr = p.prompts[i];
    if (!pr || !pr.a) return '';
    return `<div class="prompt"><p class="q">${esc(pr.q)}</p><p class="a">${esc(pr.a)}</p>
      ${hearts ? `<button class="like-btn" data-kind="prompt" data-i="${i}" aria-label="לייק לתשובה: ${esc(pr.q)}">${I.heart}</button>` : ''}</div>`;
  }
  function vitalsHTML(p) {
    const val = k => k === 'age' ? p.age : k === 'height' ? (p.height ? p.height + ' ס״מ' : '') : p[k];
    const strip = STRIP.filter(([k]) => val(k));
    const lines = LINES.filter(([k]) => p[k]);
    return `<section class="vitals" aria-label="פרטים">
      <div class="strip">${strip.map(([k, ic]) => `<span title="${LABELS[k] || ''}">${I[ic]}${esc(val(k))}</span>`).join('')}</div>
      ${lines.map(([k, ic]) => `<div class="vline">${I[ic]}<span><span class="sr">${LABELS[k]}: </span>${k === 'wantKids' ? 'רוצה ילדים: ' : ''}${esc(p[k])}</span></div>`).join('')}
    </section>`;
  }
  // Same rhythm as Hinge: photo, vitals, prompt, two photos, prompt, two photos, prompt, photo
  function profileBody(p, hearts) {
    return [photoHTML(p, 0, hearts), vitalsHTML(p), promptHTML(p, 0, hearts), photoHTML(p, 1, hearts), photoHTML(p, 2, hearts),
      promptHTML(p, 1, hearts), photoHTML(p, 3, hearts), photoHTML(p, 4, hearts), promptHTML(p, 2, hearts), photoHTML(p, 5, hearts)].join('');
  }

  function sheet(html, label, cls = '') {
    const L = $('#layer');
    L.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;
    $('#sheet-bg').onclick = e => { if (e.target.id === 'sheet-bg') closeSheet(); };
    document.addEventListener('keydown', escClose);
    return L;
  }
  function escClose(e) { if (e.key === 'Escape') closeSheet(); }
  const closeSheet = () => { $('#layer').innerHTML = ''; document.removeEventListener('keydown', escClose); };

  // Full profile in a sheet, with optional actions at the bottom
  function viewProfile(p, actions = '') {
    sheet(`<div class="sheet-head"><h2 class="p-name">${esc(p.name)}</h2><button class="icon-btn" id="sheet-close" aria-label="סגירה">${I.x}</button></div>
      <div class="profile">${profileBody(p, false)}</div>${actions ? `<div class="sheet-actions">${actions}</div>` : ''}`, 'פרופיל של ' + p.name, 'tall');
    $('#sheet-close').onclick = closeSheet;
  }

  // ---------- Discover header: city search, city chips, filters button ----------
  function renderHeader() {
    const top = $('#top');
    if (tab !== 'discover') { top.innerHTML = `<div class="topbar">${brand}</div>`; return; }
    const cities = Object.entries(DISC.cityCounts).sort((a, b) => b[1] - a[1]).map(([c]) => c);
    const n = activeFilters();
    top.innerHTML = `<div class="topbar">${brand}
        <button class="filter-btn ${n ? 'on' : ''}" id="open-filters">${I.sliders}<span>סינון</span>${n ? `<b>${n}</b>` : ''}</button></div>
      <div class="search-field">${I.search}
        <input id="city-q" type="search" list="city-list" placeholder="באיזו עיר לחפש?" value="${esc(F.city)}" aria-label="חיפוש לפי עיר" autocomplete="off">
        <button class="clear" id="city-clear" aria-label="ניקוי החיפוש" ${F.city ? '' : 'hidden'}>${I.x}</button>
        <datalist id="city-list">${CITIES.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <div class="chips" role="group" aria-label="ערים">
        <button class="chip" data-city="" aria-pressed="${!F.city}">כל הערים</button>
        ${cities.map(c => `<button class="chip" data-city="${esc(c)}" aria-pressed="${F.city === c}">${esc(c)}<span class="n">${DISC.cityCounts[c]}</span></button>`).join('')}
      </div>`;
    let t;
    $('#city-q').addEventListener('input', e => { F.city = e.target.value.trim(); clearTimeout(t); t = setTimeout(refreshDiscover, 300); });
    $('#city-clear').onclick = () => { F.city = ''; refreshDiscover(); };
    $('#open-filters').onclick = openFilters;
    top.querySelectorAll('.chip').forEach(b => b.onclick = () => { F.city = b.dataset.city; refreshDiscover(); });
  }

  function openFilters() {
    const sel = (id, label, opts, cur) => `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    const any = list => [['', 'הכל'], ...list.map(o => [o, o])];
    sheet(`<h2 class="h2">מה חשוב לך?</h2>
      <div class="filter-group"><div class="filter-title">גיל</div>
        <div class="two">${sel('fl-min', 'מגיל', AGES.map(a => [a, a]), F.ageMin)}${sel('fl-max', 'עד גיל', AGES.map(a => [a, a === 80 ? '80+' : a]), F.ageMax)}</div></div>
      <div class="filter-group">${sel('fl-status', 'סטטוס', any(OPT.choices.status), F.status)}</div>
      <div class="filter-group">${sel('fl-relig', 'דת ואמונה', any(OPT.choices.relig), F.relig)}</div>
      <div class="filter-group">${sel('fl-kids', 'ילדים', KIDS_FILTERS, F.kids)}</div>
      <div class="sheet-actions"><button class="btn ghost" id="fl-clear">ניקוי</button><button class="btn primary" id="fl-apply">הצגת תוצאות</button></div>`, 'סינון');
    const min = $('#fl-min'), max = $('#fl-max');
    // Keep the range valid: "from" never above "to"
    min.onchange = () => { if (+min.value > +max.value) max.value = min.value; };
    max.onchange = () => { if (+max.value < +min.value) min.value = max.value; };
    $('#fl-clear').onclick = () => { Object.assign(F, { ...DEFAULT_F, city: F.city }); closeSheet(); refreshDiscover(); };
    $('#fl-apply').onclick = () => {
      Object.assign(F, { ageMin: +min.value, ageMax: +max.value, status: $('#fl-status').value, relig: $('#fl-relig').value, kids: $('#fl-kids').value });
      closeSheet(); refreshDiscover();
    };
  }

  async function refreshDiscover() {
    store('kesher-filters-v2', F);
    if (needsVerify()) { DISC = { profiles: [], total: 0, cityCounts: {} }; if (tab === 'discover') { renderHeader(); renderView(); } return; }
    const qs = new URLSearchParams({ city: F.city, ageMin: F.ageMin, ageMax: F.ageMax >= 80 ? 99 : F.ageMax, relig: F.relig, kids: F.kids, status: F.status });
    try { DISC = await api('GET', '/api/discover?' + qs); } catch (e) { toast(e.message); }
    if (tab !== 'discover') return;
    const focused = document.activeElement && document.activeElement.id === 'city-q';
    renderHeader(); renderView();
    if (focused) { const q = $('#city-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }

  // ---------- Discover ----------
  function filterSummary() {
    const parts = [];
    if (F.ageMin > 18 || F.ageMax < 80) parts.push(F.ageMax >= 80 ? `מגיל ${F.ageMin}` : `גילאי ${F.ageMin}–${F.ageMax}`);
    if (F.status) parts.push(F.status);
    if (F.relig) parts.push(F.relig);
    if (F.kids) parts.push(KIDS_FILTERS.find(k => k[0] === F.kids)[1]);
    return parts;
  }
  function renderDiscover(v) {
    if (needsVerify()) {
      v.innerHTML = `<div class="empty"><div class="empty-art">${I.send}</div><h2>נשאר רק לאמת את האימייל</h2>
        <p>שלחנו קישור אימות ל-<b dir="ltr">${esc(ME.email)}</b>. אחרי האימות תוכלו לראות אנשים, לקבל לייקים ולהתכתב. בינתיים אפשר למלא את הפרופיל.</p>
        <div class="row-btns"><button class="btn primary" id="vf-check">כבר אימתתי</button><button class="btn ghost" id="vf-resend">שליחה מחדש</button></div>
        <button class="btn text" id="vf-me">למילוי הפרופיל</button></div>`;
      $('#vf-check').onclick = async () => { ME = await api('GET', '/api/me'); if (needsVerify()) toast('עוד לא ראינו אימות. בדקו גם בתיקיית הספאם'); setTab('discover'); };
      $('#vf-resend').onclick = async () => { try { await api('POST', '/api/verify/resend'); toast('שלחנו קישור חדש'); } catch (e) { toast(e.message); } };
      $('#vf-me').onclick = () => setTab('me');
      return;
    }
    if (!ME.photos.length) {
      v.innerHTML = `<div class="empty"><div class="empty-art">${I.camera}</div><h2>קודם מעלים תמונה</h2><p>כדי לראות אחרים ולהופיע בחיפוש צריך לפחות תמונה אחת בפרופיל.</p><button class="btn primary" id="go-me">להוספת תמונות</button></div>`;
      $('#go-me').onclick = () => setTab('me'); return;
    }
    const p = DISC.profiles[0];
    const parts = filterSummary();
    if (!p) {
      v.innerHTML = `<div class="empty"><div class="empty-art">${I.search}</div><h2>אין כרגע עוד פרופילים ${F.city ? 'ב' + esc(F.city) : ''}</h2>
        <p>נסו עיר אחרת או הרחיבו את הסינון. אנשים חדשים מצטרפים כל הזמן.</p>
        <div class="row-btns">
          ${F.city ? '<button class="btn primary" id="all-cities">חיפוש בכל הערים</button>' : ''}
          ${activeFilters() ? '<button class="btn ghost" id="clear-filters">ניקוי סינון</button>' : ''}
        </div></div>`;
      const a = $('#all-cities'); if (a) a.onclick = () => { F.city = ''; refreshDiscover(); };
      const c = $('#clear-filters'); if (c) c.onclick = () => { Object.assign(F, { ...DEFAULT_F, city: F.city }); refreshDiscover(); };
      return;
    }
    v.innerHTML = `<p class="result-line">${DISC.total === 1 ? 'פרופיל אחד' : DISC.total + ' פרופילים'} ${F.city ? `ב<b>${esc(F.city)}</b>` : 'בכל הערים'}${parts.length ? ' · ' + esc(parts.join(' · ')) : ''}</p>
      <article class="profile entering" id="card" aria-label="פרופיל של ${esc(p.name)}">
        <div class="p-head"><h1 class="p-name">${esc(p.name)}</h1><button class="icon-btn" id="p-more" aria-label="אפשרויות">${I.more}</button></div>
        ${profileBody(p, true)}
      </article>
      <button class="skip" id="skip" aria-label="דילוג על ${esc(p.name)}">${I.x}</button>`;
    v.querySelectorAll('.like-btn').forEach(b => b.onclick = () => openLike(p, b.dataset.kind, +b.dataset.i));
    $('#skip').onclick = async () => {
      $('#skip').disabled = true;
      api('POST', '/api/skip', { toId: p.id }).catch(e => toast(e.message));
      await leave('left'); nextProfile();
    };
    $('#p-more').onclick = () => {
      sheet(`<h2 class="h2">${esc(p.name)}</h2><button class="btn ghost" id="pm-report">${I.shield} דיווח וחסימה</button><button class="btn text" id="pm-close">סגירה</button>`, 'אפשרויות');
      $('#pm-close').onclick = closeSheet; $('#pm-report').onclick = () => openReport(p, null);
    };
  }
  async function leave(dir) {
    const card = $('#card'); if (!card) return;
    card.classList.add(dir === 'left' ? 'leave-skip' : 'leave-like');
    await wait(260);
  }
  function nextProfile() {
    DISC.profiles.shift(); DISC.total = Math.max(0, DISC.total - 1);
    window.scrollTo({ top: 0 });
    if (!DISC.profiles.length) refreshDiscover(); else renderView();
  }

  // Like sheet: the liked photo or answer, an optional comment, and a choice of like or rose
  function openLike(p, kind, i) {
    const preview = kind === 'photo' ? photoHTML(p, i, false) : `<div class="prompt"><p class="q">${esc(p.prompts[i].q)}</p><p class="a">${esc(p.prompts[i].a)}</p></div>`;
    sheet(`<div class="like-preview">${preview}</div>
      <div class="comment"><textarea id="like-note" maxlength="140" rows="2" placeholder="הוסיפו תגובה"></textarea></div>
      <div class="sheet-actions"><button class="btn rose" id="like-rose">${I.rose} ורד</button><button class="btn primary" id="like-send">${I.heartFill} שליחת לייק</button></div>`, 'שליחת לייק ל' + p.name);
    $('#like-note').focus();
    const send = async rose => {
      $('#like-send').disabled = $('#like-rose').disabled = true;
      try {
        const r = await api('POST', '/api/like', { toId: p.id, kind, idx: i, note: $('#like-note').value, rose });
        closeSheet();
        if (tab === 'discover') { await leave('right'); nextProfile(); }
        if (r.match) showMatch(r.profile, r.matchId); else toast(rose ? `שלחת ורד ל${p.name}` : `הלייק נשלח ל${p.name}`);
      } catch (e) { toast(e.message); $('#like-send').disabled = $('#like-rose').disabled = false; }
    };
    $('#like-send').onclick = () => send(false);
    $('#like-rose').onclick = () => send(true);
  }

  function showMatch(p, matchId) {
    const L = $('#layer');

  async function renderChat(v) {
    const m = chatWith, p = m.other;
    let lastId = 0, first = true, pulling = null;
    v.innerHTML = `<div class="chat-head"><button class="icon-btn" id="back" aria-label="חזרה להתאמות">${I.back}</button>
      <button class="chat-who" id="chat-profile">${avatarHTML(p)}<span><b>${esc(p.name)}</b><small>${esc(p.city)}${p.job ? ' · ' + esc(p.job) : ''}</small></span></button>
      <button class="icon-btn" id="chat-menu" aria-label="אפשרויות">${I.more}</button></div>
      <div class="chat" id="chat"><div class="bubble ctx">${I.shield} אל תשתפו פרטים כמו כתובת או פרטי בנק עם אנשים שעוד לא פגשתם.</div></div>
      <form class="composer" id="composer"><input id="msg" placeholder="כתיבת הודעה" autocomplete="off" aria-label="הודעה" maxlength="1000"><button class="send" aria-label="שליחה">${I.send}</button></form>`;
    $('#back').onclick = () => { chatWith = null; stopPoll(); renderView(); };
    $('#chat-profile').onclick = () => viewProfile(p);
    $('#chat-menu').onclick = () => {
      sheet(`<h2 class="h2">${esc(p.name)}</h2>
        <button class="btn ghost" id="cm-unmatch">ביטול ההתאמה</button><button class="btn ghost" id="cm-report">${I.shield} דיווח וחסימה</button><button class="btn text" id="cm-close">סגירה</button>`, 'אפשרויות שיחה');
      $('#cm-close').onclick = closeSheet;
      $('#cm-report').onclick = () => openReport(p, m.id);
      $('#cm-unmatch').onclick = async e => {
        const b = e.currentTarget;
        if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'לחיצה נוספת תבטל את ההתאמה'; b.classList.add('danger'); return; }
        await api('POST', `/api/matches/${m.id}/unmatch`).catch(x => toast(x.message));
        closeSheet(); chatWith = null; stopPoll(); renderView(); toast('ההתאמה בוטלה');
      };
    };
    const chat = $('#chat');
    // One fetch at a time, so overlapping polls never show a message twice
    function pull() { pulling ??= fetchNew().finally(() => { pulling = null; }); return pulling; }
    async function fetchNew() {
      try {
        const msgs = await api('GET', `/api/matches/${m.id}/messages?after=${lastId}`);
        if (!msgs.length || !document.body.contains(chat)) return;
        const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
        chat.insertAdjacentHTML('beforeend', msgs.map(x => `<div class="bubble ${x.mine ? 'me' : 'them'}">${esc(x.body)}</div>`).join(''));
        lastId = msgs[msgs.length - 1].id;
        if (atBottom || first) window.scrollTo({ top: document.body.scrollHeight, behavior: first ? 'auto' : 'smooth' });
        first = false;
      } catch (e) { if (/לא נמצאה/.test(e.message)) { stopPoll(); chatWith = null; toast('השיחה נסגרה'); renderView(); } }
    }
    // Attach the send handler before the first load, so an early tap never submits the form natively
    $('#composer').onsubmit = async e => {
      e.preventDefault();
      const input = $('#msg'), body = input.value.trim(); if (!body) return;
      input.value = '';
      try { await api('POST', `/api/matches/${m.id}/messages`, { body }); await pull(); } catch (x) { toast(x.message); input.value = body; }
      input.focus();
    };
    stopPoll(); pollTimer = setInterval(pull, 3000);
    await pull();
  }
  function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  // ---------- My profile ----------
  // Shrinks big phone photos before upload
  function shrink(file) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  // ---------- Tabs ----------
  const TABS = [['discover', 'גילוי', I.discover], ['likes', 'אהבו אותך', I.heart], ['matches', 'התאמות', I.chat], ['me', 'פרופיל', I.me]];
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(([id, label, ic]) => `<button data-tab="${id}" aria-label="${label}" ${tab === id ? 'aria-current="page"' : ''}>${id === 'me' && ME && ME.photos[0] ? avatarHTML(ME, 'tab-avatar') : ic}<span>${label}</span>
      ${id === 'likes' && likesCount ? `<span class="badge">${likesCount}</span>` : ''}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  }
  function setTab(t) {
    if (t !== 'matches') chatWith = null;
    stopPoll(); closeSheet(); tab = t; renderTabs(); renderHeader(); window.scrollTo({ top: 0 });
    if (t === 'discover' && !needsVerify()) { $('#view').innerHTML = '<div class="loading" aria-label="טוען"></div>'; refreshDiscover(); } else renderView();
  }
  function renderView() {
    const v = $('#view');
    ({ discover: renderDiscover, likes: renderLikes, matches: renderMatches, me: renderMe })[tab](v);
  }
  // Keep the "likes you" badge fresh
  setInterval(() => { if (ME && tab !== 'likes') refreshLikesCount(); }, 30000);

  // ---------- Boot ----------
  (async () => {
    try { OPT = await api('GET', '/api/options'); } catch (e) { $('#view').innerHTML = '<p class="form-error">אין חיבור לשרת. נסו לרענן את הדף.</p>'; return; }
    // Links from emails arrive as ?verify=… or ?reset=…; clear them from the address bar once read
    const params = new URLSearchParams(location.search);
    const verifyToken = params.get('verify'), resetToken = params.get('reset');
    if (verifyToken || resetToken) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    if (resetToken) return showReset(resetToken);
    if (verifyToken) {
      try { await api('POST', '/api/verify', { token: verifyToken }); toast('האימייל אומת. ברוכים הבאים!'); } catch (e) { toast(e.message); }
    }
    try { await startApp(); } catch (e) { showAuth(verifyToken ? 'login' : 'register'); }
  })();
})();

</script>
