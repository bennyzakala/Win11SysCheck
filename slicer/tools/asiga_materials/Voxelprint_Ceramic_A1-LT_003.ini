Version=5

;postcuring: 

[General]
Name="Voxelprint Ceramic A1-LT_003"
Heater Temperature=0 ;target (heats during print)
Minimum Temperature=0 ;start of print (printer waits until this temp is reached, set it below Heater Temperature to prevent long starting delays)
Heater Enable=false ;(this needs to be true to make sure it heats if you want it to heat)

[Cure]
Temperature=65
Minimum Temperature=60
Time=1800
;Dose=5
Power Level=100
Vacuum=true
Vacuum Target=0.010
Minimum Vacuum=0.015
Gas=false
Gas Cycles=1

[:/Gen-2UV/General]
Printer Classes=["Pico UV385", "PRO UV385", "MAX UV385", "PRO 4K UV385", Ultra, "Max 2"]

[:/Gen-2UV/Curing]
Light Intensity=4.2 ;maximum light intensity
;Support Exposure=100 ;increase to overcure supports

Z=[	3.5	,	0.03	,	7.08	]
Z=[	3.8	,	0.05	,	7.08	]
Z=[	4.2	,	0.07	,	7.08	]
Z=[	4.5	,	0.09	,	7.08	]
Z=[	5.0	,	0.11	,	7.08	]
Z=[	5.4	,	0.13	,	7.08	]
Z=[	6.0	,	0.15	,	7.08	]
Z=[	6.5	,	0.17	,	7.08	]
Z=[	7.1	,	0.19	,	7.08	]
Z=[	7.8	,	0.21	,	7.08	]
Z=[	8.5	,	0.23	,	7.08	]
Z=[	9.4	,	0.25	,	7.08	]
Z=[	10.2	,	0.27	,	7.08	]
Z=[	11.2	,	0.29	,	7.08	]
Z=[	18.4	,	0.4	,	7.08	]

Offset=0.160 ; M=0.11; B=0.44;
Z Compensation=0.05  ;should be positive, remove this value completely from INI if Z Comp should automatically be equal to the Offset
Burn-In Layers=1
Burn-In Light Intensity=1 ;dont touch this.
Burn-In Support Exposure=100
Burn-In Exposure=0.67   ;reduce if sticking too hard, increase if doesnt attach properly
XY Scale=1.001     ;shrinkage compensation
XY Compensation=0   ;should be negative, subtracted EACH Edge (2x) ;bleeding in XY compensation, es handelt sich bei dem Wert um die Dicke! 


[Delays]
Burn-In Wait Time (After Exposure)=5
Burn-In Wait Time (After Approach)=5
Burn-In Wait Time (After Separation)=5
Normal Wait Time (After Exposure)=0.1


[:/Not-4K/General]
Printer Classes=["Pico UV385", "PRO UV385", "MAX UV385", "Max 2"]
Slice Thickness Presets=[0.05,0.075,0.1,0.15]
Slice Thickness= 0.050

[:/Not-4K/Mechanics]
;Separation Distance=10 ; mm
Separation Velocity= 4.3; mm/s
Separation Acceleration= 2.475; mm/s
Approach Velocity= 4.3; mm/s
;Separation Acceleration=0.3 ;mm/s
Separation Pressure Limit=300
Viscosity Range=1.1  ;you can measure this value in material test
Motor Timeout=60

[:/Ultra/General]
Printer Classes=[Ultra]
Slice Thickness Presets=[0.05,0.075,0.1,0.15]
Slice Thickness= 0.050

[:/Ultra/Mechanics]
Separation Velocity= 4.3; mm/s
Separation Acceleration= 2.475; mm/s
Approach Velocity= 4.3; mm/s
Viscosity Range=1.1  ;you can measure this value in material test
Motor Timeout=60

[:/4K/General]
Printer Classes=["PRO 4K UV385"]
Slice Thickness Presets=[ 0.05,0.075,0.1,0.15]
Slice Thickness= 0.050

[:/4K/Mechanics]
Separation Velocity= 4.3; mm/s
Approach Velocity= 4.3; mm/s
Separation Acceleration=0.5 ;mm/s
Separation Pressure Limit=300
Viscosity Range=1.1  ;you can measure this value in material test
Motor Timeout=120

[:/4K/Curing]
Light Intensity/Maximum=7 ;maximum light intensity - keep this at 7 for now.

[:/PRO-Platform/General]
Printer Classes=["PRO UV385", "PRO UV405"]
Slice Thickness Presets=[0.05, 0.075, 0.1,0.15]
Slice Thickness = 0.05

[:/PRO-Platform/Mechanics]
Separation Distance=12 ; mm
Separation Velocity= 5; mm/s
Approach Velocity= 10; mm/s
Slides Per Layer=0 ;

[:/PRO-Platform/Delays]
Burn-In Wait Time (After Exposure)=10
Burn-In Wait Time (After Separation)=5
Burn-In Wait Time (After Aproach)=60
Normal Wait Time (After Exposure)=0.1
Normal Wait Time (After Approach)=1

[Support]
Leveling=true
Leveling Height=2.0
Tallest=false
Tallest Height=0.0
Slope=35
Side Feature=2.0
Spacing=2
Strength=40
Torsion=0
Accuracy=0.1
Intersupport=true
Contact=0.35 
Island=0.8
Overshoot=0.6
MaximumWidth=1.5
Side Faces=12
AspectRatio=2
